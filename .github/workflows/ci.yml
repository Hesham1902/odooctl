name: CI

# NOTE: automatic push/PR triggers are disabled because the GitHub account's
# Actions are locked by a billing-review flag ($0 balance - see README history).
# Run manually from the Actions tab ("Run workflow") once unlocked, or restore:
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        timeout-minutes: 15
        run: pytest -q -rf

  gui:
    # Same environment as the Linux release job: catches Qt-only test failures
    # without having to cut a release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-3 libegl1 libfontconfig1 libgl1 libxkbcommon0
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Tests
        timeout-minutes: 15
        run: pytest -q -rf
